name: RpgCore
version: 0.1.0
main: ru.projectst.rpgcore.RpgCorePlugin
api-version: '1.21'
authors: [VeekRay]
description: Статы, статусы, скиллы, предметы и мобы одним плагином

# Классический plugin.yml, а не paper-plugin.yml: сборка гибридная (Youer на
# базе Mohist), и поддержка нового формата у гибридов отстаёт. Терять запуск
# ради синтаксиса не стоит.

# Права разделены: игровые подкоманды доступны всем, админские — только
# операторам. Одно право на всю команду означало бы, что игрок не может ни
# выбрать класс, ни разложить навыки по слотам.
commands:
  rpg:
    description: Классы, навыки, прогресс и отладка контента
    usage: /rpg class | unlock | upgrade | bind | slot | mana | progress | validate

permissions:
  rpgcore.play:
    description: Свои класс, навыки и слоты
    default: true
  rpgcore.admin:
    description: Проверка контента, отладка, выдача опыта
    default: op
