# Подмена естественного спавна.
#
# «В этом мире вместо такого-то ванильного существа с такой-то вероятностью
# появляется наш моб». Этого достаточно, чтобы заселить мир, и это читается
# целиком — в отличие от спавнеров с радиусами и условиями, которые приходилось
# искать по трём файлам.
#
# Подмена идёт только на естественном спавне: моб, поставленный командой или
# призванный навыком, под правило не попадает.
#
# Пустой список миров означает «в любом». Так сделано сознательно: перечислять
# все миры ради одного правила — верный способ забыть новый мир.

rules:
  - { mob: desert_scorpion, replaces: SILVERFISH, chance: 60 }
  - { mob: sand_revenant, replaces: HUSK, chance: 25 }
