# Дубовый оберег — талисман друида.
#
# Слот any: оберег работает, пока лежит в инвентаре. Слот объявлен у предмета, а
# не угадывается по материалу — иначе кольцо приходилось бы выдавать за шлем,
# чтобы оно вообще что-то давало.

id: druid_oaken_charm
display: "Дубовый оберег"
material: OAK_SAPLING
rarity: rare
slot: any

lore:
  - "Пока он при вас, лес помнит,"
  - "на чьей вы стороне."

requires:
  class: druid

stats:
  effect_duration: 12
  physical_defense: 3
