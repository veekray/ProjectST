# Определения статов.
#
# Допустимые ключи — ровно те, что читает загрузчик: display, base, min, max,
# rounding, effect. Любой другой ключ будет назван ошибкой с номером строки:
# отдельной схемы нет, поэтому она не может разойтись с кодом.
#
# Порядок применения надбавок фиксирован и одинаков для всех статов:
#   база -> сумма FLAT -> сумма PERCENT -> произведение MULT -> min/max -> округление
#
# rounding: none | floor | ceil | nearest
#
# ---------------------------------------------------------------- рейтинг
# Раздел effect означает: это РЕЙТИНГ, а не проценты. Сколько процентов он даёт,
# считает кривая насыщения:
#
#     процент = cap * рейтинг / (рейтинг + cap)
#
# У неё один параметр — cap, предел, к которому она стремится и которого не
# достигает ни при каком значении. Поэтому потолок сверху не нужен: сотого
# процента уклонения или снижения перезарядки не бывает в принципе.
#
# Наклон у нуля всегда единичный: первые пункты рейтинга дают примерно столько
# же процентов, сколько их самих. Поэтому числа предметов и классов, писавшиеся
# когда-то прямо в процентах, продолжают значить почти то же — расходится только
# верх, где и должна работать убывающая отдача.
#
# Для cap = 100 это выглядит так:
#     25 ->  20%     100 -> 50%     300 -> 75%
#     50 ->  33%     200 -> 67%     400 -> 80%
#
# text — фраза, которую игрок видит в меню, наведя курсор на стат. Буква N в ней
# заменяется на процент со знаком. Фраза лежит здесь, а не в коде, потому что это
# слова для игрока, а не правило движка.
#
# inverted: true означает «рейтинг растёт — показанная величина убывает». Нужно
# защитам: их рейтинг снижает получаемый урон, и честная фраза про него —
# «−60% получаемого урона». На бой это не влияет: конвейер всегда берёт величину
# самой кривой, разворачивается только знак в тексте.
#
# Статы без effect — не про проценты вовсе: запас здоровья, запас маны,
# восстановление в секунду. Им пояснять нечего, и подсказка о них молчит.

stats:

  # ---------------------------------------------------------------- урон
  skill_damage:
    display: "Урон навыков"
    base: 0
    min: -90
    max: 10000
    rounding: none
    effect:
      cap: 200
      text: "N% к урону навыков"

  physical_damage:
    display: "Физический урон"
    base: 0
    min: -90
    max: 10000
    effect:
      cap: 200
      text: "N% к физическому урону"

  magic_damage:
    display: "Магический урон"
    base: 0
    min: -90
    max: 10000
    effect:
      cap: 200
      text: "N% к магическому урону"

  # Шанс крита. Потолок ниже ста намеренно: удар, который критует всегда, — это
  # не крит, а просто другой урон.
  critical_strike_chance:
    display: "Шанс крита"
    base: 5
    min: 0
    max: 10000
    effect:
      cap: 75
      text: "N% ударов критические"

  # Сила крита. Ноль означает обычный двойной урон: крит без этого стата всё
  # равно крит, и это проверено тестом конвейера.
  critical_strike_power:
    display: "Сила крита"
    base: 0
    min: 0
    max: 10000
    effect:
      cap: 300
      text: "крит бьёт на N% сильнее обычного"

  # ---------------------------------------------------------------- защита
  # Три защиты: от физического, от магического и общая. Все три — рейтинг.
  #
  # Школьная и общая не складываются, а перемножаются: по сотне в каждой дают
  # три четверти вместе, а не всё.
  #
  # Отрицательный рейтинг — уязвимость: минус двадцать означает плюс двадцать
  # процентов получаемого урона. Хуже, чем вдвое, не бывает.
  physical_defense:
    display: "Физическая защита"
    base: 0
    min: -90
    max: 10000
    effect:
      cap: 100
      text: "N% получаемого физического урона"
      inverted: true

  magic_defense:
    display: "Магическая защита"
    base: 0
    min: -90
    max: 10000
    effect:
      cap: 100
      text: "N% получаемого магического урона"
      inverted: true

  general_defense:
    display: "Общая защита"
    base: 0
    min: -90
    max: 10000
    effect:
      cap: 100
      text: "N% получаемого урона"
      inverted: true

  # ---------------------------------------------------------------- прочее
  effect_power:
    display: "Сила эффектов"
    base: 0
    min: -90
    max: 10000
    effect:
      cap: 200
      text: "N% к лечению и величине эффектов"

  effect_duration:
    display: "Длительность эффектов"
    base: 0
    min: -90
    max: 10000
    effect:
      cap: 200
      text: "N% к длительности эффектов"

  cooldown_reduction:
    display: "Снижение перезарядки"
    base: 0
    min: 0
    max: 10000
    effect:
      cap: 60
      text: "N% к времени перезарядки"
      inverted: true

  # Уклонение: шанс не получить удар вовсе. Отдельно от снижения урона
  # намеренно — снижение режет каждый удар понемногу и предсказуемо, уклонение
  # изредка убирает удар целиком. Смешать их в одно число значило бы потерять
  # разницу, на которой строятся плут и его подклассы.
  dodge_rating:
    display: "Уклонение"
    base: 0
    min: 0
    max: 10000
    effect:
      cap: 50
      text: "N% ударов уходит в пустоту"

  # Получаемое лечение. Отрицательное значение — анти-хил, на нём держатся
  # Удавка и Трупный яд ассасина.
  incoming_healing:
    display: "Получаемое лечение"
    base: 0
    min: -100
    max: 10000
    effect:
      cap: 200
      text: "N% к получаемому лечению"

  # Скорость атаки: от неё напрямую зависит, как быстро оружие готово к
  # следующему удару.
  attack_speed:
    display: "Скорость атаки"
    base: 0
    min: -80
    max: 10000
    effect:
      cap: 150
      text: "N% к скорости атаки"

  # Радиус площадных навыков. Дальность снарядов он не трогает: «шире» и
  # «дальше» — разные вещи.
  skill_radius:
    display: "Радиус навыков"
    base: 0
    min: -50
    max: 10000
    effect:
      cap: 100
      text: "N% к радиусу навыков"

  # Вампиризм: сколько нанесённого урона возвращается здоровьем. Считается в
  # одном месте на оба пути урона — и на навыки, и на обычные удары.
  lifesteal:
    display: "Вампиризм"
    base: 0
    min: 0
    max: 10000
    effect:
      cap: 100
      text: "N% урона возвращается здоровьем"

  # Скорость передвижения.
  movement_speed:
    display: "Скорость"
    base: 0
    min: -80
    max: 10000
    effect:
      cap: 100
      text: "N% к скорости передвижения"

  # ---------------------------------------------------------------- ресурсы
  # Ресурс класса — стат, а не отдельное число в классе: иначе класс, предмет и
  # навык получили бы три разных способа на него влиять, и однажды они
  # разошлись бы. Чем платит класс, объявлено в его файле: мана у магов, сила
  # духа у остальных.
  #
  # У запасов и восстановления нет раздела effect, и это не упущение: сто
  # процентов маны — это не величина, а бессмыслица. Их значение само и есть
  # ответ на вопрос «сколько», поэтому подсказка о них молчит.
  max_mana:
    display: "Запас маны"
    base: 100
    min: 0
    max: 10000
    rounding: nearest

  mana_regen:
    display: "Восстановление маны"
    base: 2
    min: 0
    max: 200

  # Сила духа — ресурс не магических классов. Отдельные статы, но тот же
  # механизм, что у маны: класс объявляет, чем платит, и дальше всё одинаково.
  # Отдельные именно потому, что это другой запас: предмет «на ману» не должен
  # молча усиливать воина.
  max_spirit:
    display: "Запас силы духа"
    base: 100
    min: 0
    max: 10000
    rounding: nearest

  spirit_regen:
    display: "Восстановление силы духа"
    base: 4
    min: 0
    max: 200

  # Запас здоровья. Значение уходит в ванильный атрибут игрока: без этого стат
  # был бы числом, которое нигде не видно, а именно такие числа в старом стеке
  # и расходились с тем, что происходило в бою.
  max_health:
    display: "Здоровье"
    base: 20
    min: 1
    max: 1000
    rounding: nearest

  # ---------------------------------------------------------------- выносливость
  # Общий запас всех игроков, независимо от класса: из него платится врождённый
  # рывок. Ресурсом класса быть не может — иначе уклонение покупалось бы уроном,
  # и «нечем отступить» означало бы «нечем ударить». Попытку объявить её ресурсом
  # класса загрузчик назовёт ошибкой.
  #
  # Числа рассчитаны на рывок: три заряда по двадцать — это шестьдесят за
  # рывок-рывок-рывок, и четыре в секунду возвращают их примерно с той же
  # скоростью, с какой возвращаются сами заряды. Поэтому выносливость не мешает
  # ходить, но и не даёт сделать из рывка способ передвижения.
  max_stamina:
    display: "Запас выносливости"
    base: 100
    min: 0
    max: 10000
    rounding: nearest

  stamina_regen:
    display: "Восстановление выносливости"
    base: 4
    min: 0
    max: 200
