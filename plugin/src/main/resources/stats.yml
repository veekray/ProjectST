# Определения статов.
#
# Допустимые ключи — ровно те, что читает загрузчик: display, base, min, max,
# rounding. Любой другой ключ будет назван ошибкой с номером строки: отдельной
# схемы нет, поэтому она не может разойтись с кодом.
#
# Порядок применения надбавок фиксирован и одинаков для всех статов:
#   база -> сумма FLAT -> сумма PERCENT -> произведение MULT -> min/max -> округление
#
# rounding: none | floor | ceil | nearest

stats:

  # ---------------------------------------------------------------- урон
  skill_damage:
    display: "Урон навыков"
    base: 0
    min: -90
    max: 1000
    rounding: none

  physical_damage:
    display: "Физический урон"
    base: 0
    min: -90
    max: 1000

  magic_damage:
    display: "Магический урон"
    base: 0
    min: -90
    max: 1000

  critical_strike_chance:
    display: "Шанс крита"
    base: 5
    min: 0
    max: 100

  critical_strike_power:
    display: "Сила крита"
    base: 0
    min: 0
    max: 500

  # ---------------------------------------------------------------- защита
  # Три защиты: от физического, от магического и общая. Все три — РЕЙТИНГ, а не
  # проценты. Сколько процентов снимает рейтинг, считает конвейер по кривой
  # насыщения:
  #
  #     доля = рейтинг / (рейтинг + 100)
  #
  #       25 ->  20%      100 -> 50%      300 -> 75%
  #       50 ->  33%      200 -> 67%      400 -> 80%
  #
  # Каждый следующий пункт стоит столько же, а даёт меньше, и ста процентов не
  # бывает ни при каком значении — поэтому потолка сверху нет.
  #
  # Школьная и общая не складываются, а перемножаются: по сотне в каждой дают
  # три четверти вместе, а не всё.
  #
  # Отрицательный рейтинг — уязвимость, и он линеен: минус двадцать означает
  # плюс двадцать процентов получаемого урона. Хуже, чем вдвое, не бывает.
  physical_defense:
    display: "Физическая защита"
    base: 0
    min: -90
    max: 2000

  magic_defense:
    display: "Магическая защита"
    base: 0
    min: -90
    max: 2000

  general_defense:
    display: "Общая защита"
    base: 0
    min: -90
    max: 2000

  # ---------------------------------------------------------------- прочее
  effect_power:
    display: "Сила эффектов"
    base: 0
    min: -90
    max: 500

  effect_duration:
    display: "Длительность эффектов"
    base: 0
    min: -90
    max: 500

  cooldown_reduction:
    display: "Снижение перезарядки"
    base: 0
    min: 0
    max: 60

  # Уклонение: шанс не получить удар вовсе. Отдельно от снижения урона
  # намеренно — снижение режет каждый удар понемногу и предсказуемо, уклонение
  # изредка убирает удар целиком. Смешать их в одно число значило бы потерять
  # разницу, на которой строятся плут и его подклассы.
  dodge_rating:
    display: "Уклонение"
    base: 0
    min: 0
    max: 60

  # Получаемое лечение в процентах сверх обычного. Отрицательное значение —
  # анти-хил, на нём держатся Удавка и Трупный яд ассасина.
  incoming_healing:
    display: "Получаемое лечение"
    base: 0
    min: -100
    max: 300

  # Скорость атаки в процентах сверх обычной: от неё напрямую зависит, как
  # быстро оружие готово к следующему удару.
  attack_speed:
    display: "Скорость атаки"
    base: 0
    min: -80
    max: 200

  # Радиус площадных навыков в процентах сверх объявленного в балансе.
  # Дальность снарядов он не трогает: «шире» и «дальше» — разные вещи.
  skill_radius:
    display: "Радиус навыков"
    base: 0
    min: -50
    max: 200

  # Вампиризм: сколько процентов нанесённого урона возвращается здоровьем.
  # Считается в одном месте на оба пути урона — и на навыки, и на обычные удары.
  lifesteal:
    display: "Вампиризм"
    base: 0
    min: 0
    max: 200

  # Скорость передвижения в процентах сверх обычной.
  movement_speed:
    display: "Скорость"
    base: 0
    min: -80
    max: 200

  # ---------------------------------------------------------------- ресурсы
  # Мана — стат, а не отдельное число в классе: иначе класс, предмет и навык
  # получили бы три разных способа на неё влиять, и однажды они разошлись бы.
  max_mana:
    display: "Запас маны"
    base: 100
    min: 0
    max: 10000
    rounding: nearest

  mana_regen:
    display: "Восстановление маны"
    base: 2
    min: 0
    max: 200

  # Запас здоровья. Значение уходит в ванильный атрибут игрока: без этого стат
  # был бы числом, которое нигде не видно, а именно такие числа в старом стеке
  # и расходились с тем, что происходило в бою.
  max_health:
    display: "Здоровье"
    base: 20
    min: 1
    max: 1000
    rounding: nearest

  # ---------------------------------------------------------------- выносливость
  # Ресурс плута. Отдельные статы, но тот же механизм, что у маны: класс
  # объявляет, чем платит, и дальше всё одинаково.
  max_stamina:
    display: "Запас выносливости"
    base: 100
    min: 0
    max: 10000
    rounding: nearest

  stamina_regen:
    display: "Восстановление выносливости"
    base: 4
    min: 0
    max: 200
