# Настройки плагина.
#
# Всё остальное живёт в контенте: статы, статусы, навыки, классы, предметы,
# рецепты и мобы. Здесь только то, что относится к самому серверу.

# Требовать клиентский мод.
#
# true — игрок без мода не попадёт на сервер. Это решение владельца проекта, и у
# него есть цена: любая поломка канала становится поломкой входа. Поэтому
# выключатель здесь и есть — если после обновления сервера мод перестанет
# отвечать, людей можно пустить, не трогая код.
#
# Администраторов (право rpgcore.admin) проверка не выгоняет никогда: чинить
# канал нужно изнутри.
require-mod: true

# Сколько секунд ждать рукопожатия от мода, прежде чем выгонять.
#
# Рукопожатие приходит не мгновенно: клиент шлёт его после входа в мир, и на
# слабом соединении это несколько секунд. Слишком малое число выгоняет тех, у
# кого мод есть.
mod-grace-seconds: 12

# Сколько у игрока ячеек артефактов.
#
# Артефакт в ячейке считается надетым: его статы работают, пока он там лежит.
# Сами ячейки — не инвентарь: предмет в них не выпадает со смертью и не занимает
# места в сумке, но и потрогать его можно только через окно «Артефакты».
#
# Больше семи не бывает: столько ячеек влезает в один ряд окна, а ряд, который
# нужно прокручивать, перестаёт читаться взглядом. Ноль выключает артефакты
# целиком — ячеек не будет, и окно скажет об этом словами.
#
# Уменьшать можно: артефакты из исчезнувших ячеек перестают давать статы и
# ждут в окне, пока владелец заберёт их в инвентарь. Пропасть они не могут.
artifact-slots: 4
