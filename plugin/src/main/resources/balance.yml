# Числа всех навыков.
#
# Этот файл можно править и перезагружать, не открывая файлы навыков: логика и
# баланс разведены намеренно, потому что это разные занятия с разной ценой
# ошибки. Правка числа не должна требовать чтения поведения.
#
# Значение — либо число, либо кривая по уровню:
#   damage: 6
#   cooldown: { base: 4.0, per-level: -0.2, min: 1.6 }
#
# Кривая считается как base + per-level * (уровень - 1) и ограничивается
# min/max. Нижняя граница у убывающих величин обязательна: без неё
# перезарядка на высоких уровнях уйдёт в ноль и дальше в минус.
#
# Ссылки на ключи проверяются при загрузке: /rpg validate назовёт отсутствующий
# ключ с номером строки навыка, который на него ссылается.
#
# Урон здесь не растёт с уровнем навыка, и это перенесено как было: уровень
# навыка правит стоимость и перезарядку, а силу удара — статы силы навыков и
# школы урона. Так числа в этом файле остаются сравнимыми между собой.

balance:

  # ================================================================ МАГ
  # Ядро на печатях: стоя на своей печати, маг съедает её и получает усиление
  # на один каст.

  mage_seal_core:
    # Радиус поедания больше радиуса самой печати: встать ровно в центр
    # невозможно, а «почти стою» должно считаться.
    eat_radius: 4
    duration: 20

  mage_seal_drop:
    radius: 2.5
    duration: 200
    # Не ближе этого расстояния к своей же печати: иначе касты на месте
    # складывали бы их в одну точку, а Коллапс платит уроном за каждую.
    min_gap: 2.5

  mage_flow_loop:
    mana:
      base: 14.0
      per-level: 0.5
    cooldown:
      base: 9.0
      per-level: -0.2
      min: 3.6
    radius: 5
    push: 0.6
    empowered_radius: 7
    empowered_push: 1.0
    empowered_damage: 7

  mage_mana_bolt:
    mana:
      base: 8.0
      per-level: 0.5
    cooldown:
      base: 4.0
      per-level: -0.2
      min: 1.6
    # Блоков за тик. Перенесено из старого v=55 при шаге 20 тиков в секунду.
    speed: 2.75
    range: 28
    empowered_speed: 3.5
    empowered_range: 32

  mage_bolt_hit:
    radius: 1.5
    damage: 6

  mage_bolt_hit_strong:
    radius: 1.8
    damage: 12

  mage_void_step:
    mana:
      base: 12.0
      per-level: 0.5
    cooldown:
      base: 11.0
      per-level: -0.2
      min: 4.4
    distance: 6
    empowered_distance: 12
    wave_radius: 5
    wave_damage: 6
    wave_push: 0.8

  mage_herd:
    mana:
      base: 16.0
      per-level: 0.5
    cooldown:
      base: 13.0
      per-level: -0.2
      min: 5.2
    # Точка сбора всегда впереди на это расстояние, а не там, где печать.
    gather_distance: 9
    radius: 14
    angle: 60
    pull: 0.6
    empowered_radius: 16
    empowered_angle: 80
    empowered_pull: 0.8
    root_duration: 30

  mage_scatter:
    mana:
      base: 20.0
      per-level: 0.5
    cooldown:
      base: 18.0
      per-level: -0.2
      min: 7.2
    speed: 2.0
    range: 16
    empowered_range: 18

  mage_collapse:
    mana:
      base: 42.0
      per-level: 0.5
    cooldown:
      base: 34.0
      per-level: -0.2
      min: 13.6
    gather_distance: 10

  mage_collapse_do:
    # Кого стянет печать: радиус вокруг каждой своей печати.
    seal_reach: 6
    # Насколько далеко собираются сами печати.
    field_radius: 30
    pull: 0.7
    hit_radius: 5
    damage: 10
    damage_per_seal: 8
  # ================================================================ ДРУИД
  # Два счётчика: Рост копится поддержкой, Увядание — атакой. Усиливает всегда
  # противоположный, поэтому награда идёт за смену роли, а не за одну кнопку.

  druid_poison_ivy:
    mana:
      base: 10.0
      per-level: 0.5
    cooldown:
      base: 5.0
      per-level: -0.2
      min: 2.0
    radius: 5
    empowered_radius: 7
    damage: 7
    stun_duration: 20
    poison_duration: 80
    slow_duration: 80
    counter_duration: 300

  druid_life_spores:
