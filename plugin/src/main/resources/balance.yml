      base: 14.0
      per-level: 0.5
    cooldown:
      base: 9.0
      per-level: -0.2
      min: 3.6
    radius: 5
    push: 0.6
    empowered_radius: 7
    empowered_push: 1.0
    empowered_damage: 7

  mage_mana_bolt:
