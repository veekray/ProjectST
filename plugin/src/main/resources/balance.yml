    cooldown:
      base: 32.0
      per-level: -0.2
      min: 12.8
    radius: 6
    # Шесть секунд поля; переключение раз в секунду задано в самом навыке:
    # промежуток тика — это структура, а не число для балансировки.
    duration: 120

  druid_bloom_tick:
    radius: 6
    heal_big: 8
    heal_small: 4
    harm_small: 4
    harm_big: 8
