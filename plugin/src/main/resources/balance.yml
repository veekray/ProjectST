  # Врождённый рывок. Один набор чисел на всех: рывок — не классовая черта, а
  # то, что умеет любой игрок с первого уровня. Разные числа по классам означали
  # бы, что класс выбирают ещё и по тому, как он уклоняется.

  dash:
    # Выносливость, а не ресурс класса: уклонение не должно покупаться уроном.
    stamina: 20
    # Перезарядка одного заряда. Зарядов три, и каждый возвращается сам, считая
    # от своей траты: три рывка подряд вернутся по одному.
    cooldown: 6.0
    strength: 1.5
    # Подъём небольшой: рывок уводит в сторону, а не подбрасывает. Ноль цеплялся
    # бы за каждый блок на пути.
    lift: 0.3
