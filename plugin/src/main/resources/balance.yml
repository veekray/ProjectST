    shield_per: 5
    heal_per: 3

  warlock_agony_cocoon:
    mana:
      base: 38.0
      per-level: 0.5
    cooldown:
      base: 36.0
      per-level: -0.2
      min: 14.4
    range: 15
    damage: 14
    damage_per_soul: 6
    # Четыре секунды базового изъятия плюс по 12 тиков за душу.
    duration: 80
    duration_per_soul: 12
  # ================================================================ ПЛУТ
  # Плут платит выносливостью, а не маной: это тот же механизм с другими
  # статами, и объявлено это один раз в его классе.

  rogue_dash:
    stamina: 10
