  rogue_mark_of_death:
    stamina: 26
    cooldown:
      base: 24.0
      per-level: -0.5
      min: 12.0
    range: 20
    blast_range: 20
    # Пять секунд до взрыва.
    duration: 100
    damage: 5
    # Было умножение на единицу плюс десять процентов за стак, то есть ровно
    # половина базы за каждый удар.
    damage_per_hit: 0.5

  rogue_mark_stack:
    duration: 200
  # ================================================================ ПРЕДМЕТЫ
  # Умения предметов платят тем же ресурсом и той же перезарядкой, что навыки.

  item_arcane_pulse:
    mana: 6
    cooldown: 2.5
    speed: 2.2
    range: 20

  item_arcane_pulse_hit:
    radius: 1.5
    damage: 5

  item_soul_drain:
    mana: 8
    cooldown: 8.0
    radius: 10
    damage: 3
    heal_per: 3

  item_shadow_nick:
    cooldown: 1.5
    radius: 4
    damage: 3
  # ================================================================ МОБЫ
  # Навыки мобов живут в том же балансе: числа сравнимы с игровыми, и это главное.

  mob_venom_sting:
    poison_duration: 60

  mob_sand_burst:
    radius: 5
    damage: 8
    push: 0.8
    blind_duration: 40

  # ================================================================ ассасин
  # Перезарядки взяты те же, что были у подкласса до отладки: в исходных файлах
  # они стояли в нуле с пометкой «боевое значение было столько-то», и перенесены
  # именно боевые.

  assassin_core_tick:
    shadow_duration: 6000

  assassin_combat_mark:
    combat_duration: 60

  assassin_shadow_grant:
    shadow_duration: 6000
    vuln_cooldown: 60

  assassin_vuln_check:
    # Ширина тыльного сектора целиком: 120 градусов это треть круга позади
    # цели, по 60 в каждую сторону от точки прямо за спиной.
    back_arc: 120

  assassin_nowhere_blade:
