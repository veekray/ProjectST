# Плут — отдельный класс, который платит выносливостью.
#
# Ресурс объявлен здесь, и этим всё сказано: дальше ворота каста, восстановление
# и показ игроку работают так же, как у мага. В старом стеке мана считалась
# одним плагином, а выносливость другим, поэтому «не хватило» выглядело
# по-разному и проверялось в разных местах.

