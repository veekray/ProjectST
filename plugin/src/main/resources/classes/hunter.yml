# Охотник — третий перенесённый подкласс, тоже отдельным классом.
#
# Причина та же, что у ассасина и трикстера: его Отход Егеря делает то же, что
# плутовский Рывок, а Выстрел на Поражение — то же, что Метка смерти. Подробнее
# — в assassin.yml.
#
# Весь класс стоит на одной идее: бить издали. Поэтому у него есть дистанция в
# условиях навыков, а не отдельный множитель в коде, и ступени видно глазами.

