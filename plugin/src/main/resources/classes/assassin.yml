# Ассасин — подкласс плута, перенесённый отдельным классом.
#
# Почему классом, а не надстройкой над плутом: его навыки плутовские заменяют,
# а не дополняют. Растворение — это тот же Шаг призрака, Клинок из Ниоткуда —
# тот же Удар из тени. Игроку, у которого есть и то и другое, пришлось бы
# держать на панели две кнопки невидимости, и разницу между ними не объяснил бы
# никто. Так же в этом ядре уже устроены друид и колдун: на старом сервере они
# были подклассами мага.
#
# Ступеней десять, а не пять: столько уровней открытия было у подкласса, и
# сжимать их означало бы выдавать навыки не тогда, когда они выдавались.

