# Воин — ствол, из которого растут рыцарь, берсерк и страйкер.
#
# Ядра у него нет, как и у плута: десять самостоятельных навыков, ничего не
# копится и не тратится. Но три из десяти дают попробовать то, что у подклассов
# станет ядром — Вызов на бой, Ярость и Связка. Воин на старших уровнях уже
# знает, куда хочет расти, и выбирает не по описанию в меню.

