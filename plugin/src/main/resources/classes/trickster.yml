# Трикстер — второй подкласс плута, перенесённый отдельным классом.
#
# Почему классом, а не надстройкой — по той же причине, что и ассасин: его
# Подмена и Ложная Смерть делают то же, что плутовские Рывок и Шаг призрака.
# Подробнее — в assassin.yml.
#
# Платит выносливостью и почти не имеет защиты: всё, что у него есть вместо
# неё, — уклонение и то, что бьют не его.

