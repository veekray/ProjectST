# Класс персонажа.
#
# tiers — с какого уровня игрока открыта ступень. Отсутствие записи означает
# «ограничений нет», а не «недоступно»: иначе забытая строка молча закрывала бы
# ветку навыков.
#
# stats — база класса, а не надбавка. Значение задаётся так же, как в слое
# баланса: числом или кривой. Форма переиспользована намеренно — иначе
# появились бы два похожих способа написать «растёт с уровнем», и однажды они
# разошлись бы в поведении.

id: mage
display: "&bМаг"
slots: 6
max-level: 60

# Очков за уровень. Ровно одно: очко — это заметное решение, куда его вложить,
# а не мелкая прибавка, которую раздают пачками.
points-per-level: 1

# Сколько опыта нужно для перехода с уровня N на N+1. Считается от уровня, а не
# от общего накопленного: поэтому правка этих чисел не сдвигает уже достигнутые
# уровни у тех, кто играет.
xp:
  base: 120
  per-level: 60

tiers:
  1: 1
  2: 5
  3: 15
  4: 30
  5: 50

stats:
  magic_damage:
    base: 0
    per-level: 0.6
    max: 120
  skill_damage:
    base: 0
    per-level: 0.3
  defense: 2
