# Рыцарь — подкласс воина, перенесённый отдельным классом.
#
# Ядро — Присяга: вызванный враг бьёт вызвавшего в полную силу, а всех
# остальных вполсилы. Подробнее в skills/knight_oath_core.yml.
#
# Прежняя Честь — шкала от нуля до пяти, которую финишеры сбрасывали целиком, —
# выброшена. Она была копией Ци страйкера вплоть до имени ауры, и, главное,
# ничего не меняла для противника: защитный класс интересен ровно настолько,
# насколько дорого его игнорировать, а игнорировать ту Честь можно было даром.

