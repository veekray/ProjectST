# Песчаный выброс: отбрасывает всех вокруг и слепит.

id: mob_sand_burst
display: "Песчаный выброс"
icon: SAND
tier: 1
internal: true

steps:

  - target: { type: self }
    do:
      - { action: sound, sound: entity_husk_ambient, pitch: 0.6 }

  - target: { type: enemies_in_radius, radius: $radius }
    do:
      - { action: damage, amount: $damage, school: physical }
      - { action: push, strength: $push, lift: 0.4 }
      - { action: potion, effect: blindness, duration: $blind_duration, amplifier: 0 }
      - { action: particles, particle: sculk_soul, shape: ring, count: 30, size: radius, fx: mob_wave }
