# Казнь: добивание раненого в Час Палача сбрасывает перезарядки.

id: assassin_execute
display: "Казнь"
class: assassin
tier: 5
internal: true

on: deal-damage

steps:

  - target: { type: trigger }
    if:
      - { caster: has-status, value: executioner }
      - { caster: has-status, value: execute_lock, not: true }
    do:
      - { action: damage, amount: $damage, school: true, basis: target_current_health }
      - { action: sound, sound: entity_player_attack_crit, volume: 1.2, pitch: 0.5 }
      - { action: particles, particle: explosion, shape: point, count: 4, size: 0.5 }

  - target: { type: trigger }
    if:
      - { caster: has-status, value: executioner }
      - { caster: has-status, value: execute_lock, not: true }
    do:
      - { action: cast, skill: assassin_execute_reset, at-targets: false }
