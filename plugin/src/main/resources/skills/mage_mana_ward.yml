# Мановый оберег: пассивка, которая срабатывает сама.
#
# Триггер написан в самом навыке одним ключом. В старом стеке он жил в чужом
# файле: тело в одном месте, строка ~onDamaged — в другом, и узнать,
# срабатывает ли навык вообще, можно было только найдя оба.
#
# Пассивка проходит через те же ворота, что и нажатие: стоит маны, уходит в
# перезарядку и не работает под тишиной. Повесить её на слот нельзя — кнопка
# не делала бы ничего, и загрузчик скажет об этом прямо.

id: mage_mana_ward
display: "Мановый оберег"
class: mage
tier: 3

on: damaged

mana: $mana
cooldown: $cooldown

steps:

  - target: { type: self }
    do:
      - { action: status, id: shield, duration: $duration, amount: $shield }
      - { action: particles, particle: electric_spark, shape: sphere, count: 16, size: 1 }
      - { action: sound, sound: block_beacon_deactivate, pitch: 1.6 }

  # Ударившего отбрасывает. Цель «тот, кто спровоцировал» — это и есть разница
  # между пассивкой и площадным навыком: отвечает она ровно тому, кто ударил.
  - target: { type: trigger }
    do:
      - { action: push, strength: $push, lift: 0.25 }
