# Тик ливня: урон и вязкость всем, кто внутри круга.

id: hunter_downpour_tick
display: "Ливень Стрел"
class: hunter
tier: 3
internal: true

steps:

  - target: { type: enemies_near_origin, radius: $radius }
    do:
      - { action: damage, amount: $damage, school: physical }
      - { action: status, id: slowed, duration: $slow_duration }
      - action: modify-stat
        stat: movement_speed
        op: flat
        value: $slow
        status: slowed
      - { action: particles, particle: crit, shape: point, count: 6, size: 0.3 }
      - { action: particles, particle: crit, shape: ring, count: 40, size: radius }
