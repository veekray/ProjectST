# 4. Сгон — конус сгоняет врагов к точке сбора, а не к магу.
#
# Точка сбора всегда в девяти блоках впереди, и это написано в шаге одной
# строкой: origin: forward 9. Раньше тянуло «к ближайшей своей печати», и это
# была двойная ошибка — печать навык кладёт сам под ноги, поэтому сгон к печати
# совпадал со сгоном к себе; а усиленная ветка была обречена, потому что ядро
# съедает печать до ветвления, и тянуть становилось не к чему.
#
# Притяжение идёт тремя слабыми тиками вместо одного сильного: один импульс
# проносит цель мимо точки сбора, а каждый следующий пересчитывает направление,
# поэтому перелёт исправляется сам.

id: mage_herd
display: "Сгон"
class: mage
icon: LEAD
tier: 3

mana: $mana
cooldown: $cooldown

steps:

  - target: { type: self }
    do:
      - { action: cast, skill: mage_seal_core, at-targets: true }
      - { action: sound, sound: entity_illusioner_prepare_blindness, volume: 0.8, pitch: 1.3 }

  # Обычный: собирает и оставляет печать в точке сбора.
  - target: { type: enemies_in_cone, radius: $radius, angle: $angle }
    origin: forward $gather_distance
    if:
      - { caster: has-status, value: empowered, not: true }
    do:
      - { action: pull, strength: $pull, ticks: 3 }
      - { action: particles, particle: enchant, shape: point, count: 10 }

  - target: { type: self }
    origin: forward $gather_distance
    if:
      - { caster: has-status, value: empowered, not: true }
    do:
      - { action: particles, particle: enchant, shape: ring, count: 20, size: 2, at-origin: true }
      - { action: cast, skill: mage_seal_drop, at-targets: true }

  # Усиленный: шире конус, тянет сильнее и приковывает.
  - target: { type: enemies_in_cone, radius: $empowered_radius, angle: $empowered_angle }
    origin: forward $gather_distance
    if:
      - { caster: has-status, value: empowered }
    do:
      - { action: pull, strength: $empowered_pull, ticks: 3 }
      - { action: particles, particle: witch, shape: point, count: 14 }

  # Корни вешаем после притяжения: иначе они погасят его на первом же тике.
  - target: { type: enemies_in_cone, radius: $empowered_radius, angle: $empowered_angle }
    origin: forward $gather_distance
    delay: 12
    if:
      - { caster: has-status, value: empowered }
    do:
      - { action: status, id: root, duration: $root_duration }
      - { action: particles, particle: witch, shape: ring, count: 26, size: 2.5, at-origin: true }
