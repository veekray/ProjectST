# Попадание манового разряда.
#
# Отдельный файл не из-за размера, а потому что это другая точка действия:
# всё здесь считается от места попадания, а не от мага. Навык вызывается
# только лучом, и связывание это знает — самостоятельно он бы получил ошибку
# «цель требует точку действия».

id: mage_mana_bolt_impact
display: "Мановый разряд — попадание"
class: mage
tier: 2

steps:

  # Урон и метка уходят по одним и тем же целям — именно потому, что это один шаг.
  - target: { type: enemies_near_origin, radius: $radius }
    do:
      - { action: damage, amount: $damage, school: magic }
      - { action: status, id: mark, duration: $mark_duration }

  # Печать в точке попадания и визуал. Шаг от лица мага, потому что печать
  # ставится в точку действия, а не на кого-то: at-origin срабатывает и при
  # промахе, поэтому печать останется там, куда прилетело, даже если никого не
  # задело. Ровно это и нужно от ядра на печатях.
  - target: { type: self }
    do:
      - { action: zone, tag: seal, radius: $seal_radius, duration: $seal_duration, at-origin: true, particle: witch }
      - { action: particles, particle: electric_spark, shape: sphere, count: 30, size: 1.2, at-origin: true }
      - { action: sound, sound: entity_wither_shoot, volume: 0.6, pitch: 1.8, at-origin: true }
