# Кровотечение тикает долей предела здоровья.
#
# Радиус ограничен сознательно: цель, ушедшая за тридцать блоков, перестаёт
# истекать кровью, и это честнее, чем урон из ниоткуда через полкарты.

id: assassin_bleed_tick
display: "Кровотечение"
class: assassin
tier: 3
internal: true

on: interval
every: 20

steps:

  - target: { type: enemies_in_radius, radius: $radius }
    if:
      - { target: has-status, value: bleed }
    do:
      - { action: damage, amount: $damage, school: true, basis: target_max_health }
      - { action: particles, particle: damage_indicator, shape: point, count: 5, size: 0.2, fx: assassin_flash }
