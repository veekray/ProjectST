# 3. Шаг в пустоту — рывок. Печать остаётся в точке старта, то есть служит
#    якорем возврата.
#
# Усиленный рывок вдвое длиннее и с ударной волной на выходе, печати не
# оставляет.
#
# След от точки старта до точки прибытия рисует сам перенос (particle и fx у
# teleport): точку прибытия знает исполнитель, и след не может уйти не туда.

id: mage_void_step
display: "Шаг в пустоту"
class: mage
icon: ENDER_PEARL
tier: 3

cost: $mana
cooldown: $cooldown

description:
  - "Рывок по взгляду. Печать остаётся"
  - "в точке старта — якорь для возврата."
  - "На своей печати: вдвое дальше и с волной."

steps:

  - target: { type: self }
    do:
      - { action: cast, skill: mage_seal_core, at-targets: true }
      - { action: sound, sound: entity_enderman_teleport, volume: 0.8, pitch: 1.4, fx: mage.void.step }

  # Печать кладём ДО рывка: она должна остаться там, откуда ушли.
  - target: { type: self }
    origin: self
    if:
      - { caster: has-status, value: empowered, not: true }
    do:
      - { action: cast, skill: mage_seal_drop, at-targets: false }
      - { action: particles, particle: portal, shape: sphere, count: 40, size: 0.5, fx: mage_puff }

  - target: { type: self }
    if:
      - { caster: has-status, value: empowered, not: true }
    do:
      - { action: teleport, forward: $distance, particle: portal, fx: mage_void_trail }
      - { action: particles, particle: reverse_portal, shape: sphere, count: 40, size: 0.5, fx: none }

  - target: { type: self }
    if:
      - { caster: has-status, value: empowered }
    do:
      - { action: particles, particle: portal, shape: sphere, count: 70, size: 0.6, fx: none }
      - { action: teleport, forward: $empowered_distance, particle: reverse_portal, fx: mage_void_trail_strong }
      - { action: particles, particle: reverse_portal, shape: sphere, count: 70, size: 0.6, fx: none }
      - { action: sound, sound: entity_generic_explode, volume: 0.7, pitch: 1.6, fx: mage.void.blast }

  # Ударная волна считается после рывка, то есть от новой позиции.
  - target: { type: enemies_in_radius, radius: $wave_radius }
    if:
      - { caster: has-status, value: empowered }
    do:
      - { action: damage, amount: $wave_damage, school: magic }
      - { action: push, strength: $wave_push, lift: 0.4 }
      - { action: particles, particle: witch, shape: point, count: 15, fx: none }
      - { action: particles, particle: witch, shape: ring, count: 30, size: radius, fx: mage_void_wave }
