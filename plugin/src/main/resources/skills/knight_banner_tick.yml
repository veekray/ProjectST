# Тик знамени: вызов входящим, защита своим.

id: knight_banner_tick
display: "Знамя"
class: knight
tier: 4
internal: true

steps:

  - target: { type: enemies_near_origin, radius: $radius }
    do:
      - { action: status, id: challenge, duration: $duration, amount: $weaken }
      - { action: particles, particle: angry_villager, shape: point, count: 4, size: 0.3, fx: knight_banner_mark }
      - { action: particles, particle: end_rod, shape: ring, count: 30, size: radius, fx: knight_banner_pulse }

  - target: { type: allies_near_origin, radius: $radius }
    do:
      - { action: status, id: banner_guard, duration: 40 }
      - action: modify-stat
        stat: general_defense
        op: flat
        value: $guard
        status: banner_guard
      - { action: particles, particle: end_rod, shape: point, count: 3, size: 0.3, fx: knight_banner_guard }
