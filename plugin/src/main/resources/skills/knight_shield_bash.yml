# 6. Карающий Щит — работает только по вызванному.
#
# Прежняя версия требовала три заряда Чести, но снимала весь запас, потому что
# частичная трата была невозможна. Теперь требования простые и честные: бить
# можно того, кого ты вызвал, и вызов за это не тратится — он подтверждается.

id: knight_shield_bash
display: "Карающий Щит"
class: knight
icon: IRON_DOOR
tier: 3

cost: $spirit
cooldown: $cooldown

description:
  - "Удар щитом по вызванному:"
  - "оглушает и подтверждает вызов."
  - "По невызванному не работает."

steps:

  - target: { type: enemies_in_cone, radius: $range, angle: 45, limit: 1 }
    if:
      - { target: has-status, value: challenge }
    do:
      - { action: damage, amount: $damage, school: physical }
      - { action: status, id: stun, duration: $stun }
      - { action: status, id: challenge, duration: $renew, amount: $weaken }
      - { action: sound, sound: item_shield_break, volume: 1.0, pitch: 1.0 }
      - { action: particles, particle: crit, shape: point, count: 20, size: 0.5, fx: knight_flash }

  - target: { type: enemies_in_cone, radius: $range, angle: 45, limit: 1 }
    if:
      - { target: has-status, value: challenge, not: true }
    do:
      - { action: message, text: "&cОн вас не слышал — сначала вызов" }
      - { action: sound, sound: entity_villager_no, volume: 0.6, pitch: 1.2 }
