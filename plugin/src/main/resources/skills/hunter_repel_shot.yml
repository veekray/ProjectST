# 2. Отбойный Выстрел — навык, который сам создаёт дистанцию.
#
# Охотник силён вдали, значит навык должен эту даль делать: попадание отбрасывает
# цель прочь и замедляет, чтобы она не вернулась сразу. Следующий выстрел по ней
# уже бьёт сильнее — и так по нарастающей.
#
# Урон считается ступенями, а не формулой за каждый блок. Ступени видно: игрок
# понимает, что он «далеко», а плавный множитель пришлось бы угадывать по
# числам урона. Автор прежней версии пришёл к тому же выводу и формулу убрал.

id: hunter_repel_shot
display: "Отбойный Выстрел"
class: hunter
icon: ARROW
tier: 1

cost: $spirit
cooldown: $cooldown
cast-time: $cast_time

description:
  - "Выстрел отбрасывает врага прочь"
  - "и замедляет его. По добыче издали"
  - "бьёт заметно больнее."

steps:

  - target: { type: self }
    do:
      - { action: sound, sound: item_crossbow_shoot, volume: 1.0, pitch: 1.1 }
      - action: projectile
        speed: $speed
        range: $range
        hit-radius: 1.0
        particle: crit
        fx: hunter_bolt
        on-hit: hunter_repel_hit
