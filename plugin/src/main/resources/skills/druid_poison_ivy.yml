# 1. Отравленный плющ — лозы бьют по площади: стан и яд.
#
# Атакующий навык, поэтому копит Увядание. Усиление требует трёх Роста, то есть
# противоположного счётчика: друид усиливается тем, чего набрал в другой роли.
# Это и есть смысл двух счётчиков — награда за смену ролей, а не за одну кнопку.

id: druid_poison_ivy
display: "Отравленный плющ"
class: druid
icon: VINE
tier: 2

cost: $mana
cooldown: $cooldown
# Под ногами — узор листьев, затем лозы хлещут. Задержка короче, чем у корней:
# плющ — частый навык, и долгий замах сделал бы его бесполезным.
cast-time: $cast_time

description:
  - "Лозы бьют по площади: оглушение и яд."
  - "Копит Увядание."
  - "На трёх Роста: шире и с замедлением."

steps:

  - target: { type: self }
    do:
      - { action: sound, sound: block_vine_place, pitch: 0.7, fx: none }

  # Обычный.
  - target: { type: enemies_in_radius, radius: $radius }
    delay: $strike_delay
    telegraph: druid_ivy_mark
    if:
      - { caster: status-stacks, value: "growth:3", not: true }
    do:
      - { action: damage, amount: $damage, school: magic }
      - { action: status, id: stun, duration: $stun_duration }
      - { action: potion, effect: poison, duration: $poison_duration, amplifier: 1 }
      - { action: particles, particle: composter, shape: point, count: 10, fx: druid_ivy_strike }
      - { action: particles, particle: composter, shape: ring, count: 30, size: radius, fx: druid_ivy_lash }

  # Усиленный: шире и вешает замедление. Тратит Рост.
  - target: { type: enemies_in_radius, radius: $empowered_radius }
    delay: $strike_delay
    telegraph: druid_ivy_mark
    if:
      - { caster: status-stacks, value: "growth:3" }
    do:
      - { action: damage, amount: $damage, school: magic }
      - { action: status, id: stun, duration: $stun_duration }
      - { action: potion, effect: poison, duration: $poison_duration, amplifier: 1 }
      - { action: potion, effect: slowness, duration: $slow_duration, amplifier: 1 }
      - { action: particles, particle: composter, shape: point, count: 12, fx: druid_ivy_strike }
      - { action: particles, particle: composter, shape: ring, count: 44, size: radius, fx: druid_ivy_lash_strong }

  - target: { type: self }
    if:
      - { caster: status-stacks, value: "growth:3" }
    do:
      - { action: remove-status, id: growth }

  # Счётчик копится в любом случае: роль навыка от усиления не меняется.
  - target: { type: self }
    do:
      - { action: status, id: wither, duration: $counter_duration }
