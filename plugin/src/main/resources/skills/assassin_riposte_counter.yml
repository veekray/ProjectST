# Контрудар: срабатывает от попадания по ассасину, пока открыто окно.

id: assassin_riposte_counter
display: "Ответный Клинок"
class: assassin
tier: 5
internal: true

on: damaged

steps:

  - target: { type: trigger }
    if:
      - { caster: has-status, value: riposte_window }
    do:
      - { action: damage, amount: $damage, school: physical }
      - { action: sound, sound: entity_player_attack_crit, volume: 1.0, pitch: 0.7 }
      - { action: particles, particle: crit, shape: point, count: 25, size: 0.4, fx: assassin_flash }

  - target: { type: self }
    if:
      - { caster: has-status, value: riposte_window }
    do:
      - { action: remove-status, id: riposte_window }
      - { action: cast, skill: assassin_shadow_grant, at-targets: true }
      - { action: reset-cooldown, skill: assassin_nowhere_blade }
