# 3. Подсечка — круговой удар, который сбивает каст.
#
# Из Напора: оглушение держится заметно дольше.

id: striker_sweep_kick
display: "Подсечка"
class: striker
icon: LEATHER_BOOTS
tier: 1

mana: $stamina
cooldown: $cooldown

description:
  - "Удар по ногам всех вокруг:"
  - "короткое оглушение сбивает чужой"
  - "замах. Из Напора — дольше. Оставляет Брешь."

steps:

  - target: { type: self }
    do:
      - { action: sound, sound: entity_player_attack_sweep, volume: 1.0, pitch: 1.3 }
      - { action: particles, particle: crit, shape: ring, count: 15, size: 2.5 }

  - target: { type: enemies_in_radius, radius: $radius }
    do:
      - { action: damage, amount: $damage, school: physical }

  - target: { type: enemies_in_radius, radius: $radius }
    if:
      - { caster: has-status, value: stance_press, not: true }
    do:
      - { action: status, id: stun, duration: $stun }

  - target: { type: enemies_in_radius, radius: $radius }
    if:
      - { caster: has-status, value: stance_press }
    do:
      - { action: status, id: stun, duration: $stun_press }
      - { action: particles, particle: crit, shape: point, count: 10, size: 0.3 }

  - target: { type: self }
    do:
      - { action: cast, skill: striker_mark_breach, at-targets: true }
