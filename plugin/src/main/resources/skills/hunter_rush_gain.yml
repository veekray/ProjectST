# 6. Азарт — пассивка, у которой нет кнопки.
#
# Попадание по добыче с дальней дистанции копит заряд, пять зарядов включают
# разгон. Промежуточных ступеней нет намеренно: либо разогнался, либо нет, и
# это видно по одному статусу, а не по пяти похожим.
#
# Разгон вешается отдельным навыком под своим замком: иначе надбавка
# накладывалась бы на каждое следующее попадание и за десяток выстрелов
# раздула бы статы до абсурда — так и было в старом стеке, пока там не завели
# маркерную ауру ровно для этого.

id: hunter_rush_gain
display: "Азарт"
class: hunter
tier: 3
internal: true

on: deal-damage

steps:

  - target: { type: trigger }
    if:
      - { target: has-status, value: quarry }
      - { target: distance, value: "15:200" }
    do:
      - { action: cast, skill: hunter_rush_add, at-targets: false }
