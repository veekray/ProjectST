# 9. Удар Палача — добивание, которое возвращает себя.

id: berserker_execution
display: "Удар Палача"
class: berserker
icon: IRON_AXE
tier: 5

cost: $spirit
cooldown: $cooldown

description:
  - "По раненому бьёт втрое."
  - "Если добил — удар возвращается"
  - "без перезарядки."

steps:

  - target: { type: self }
    do:
      - { action: sacrifice, percent: $cost }
      - { action: cast, skill: berserker_heat, at-targets: true }
      - { action: sound, sound: entity_wither_shoot, volume: 1.0, pitch: 0.6 }

  - target: { type: enemies_in_cone, radius: $range, angle: 45, limit: 1 }
    do:
      - { action: damage, amount: $damage, school: physical }
      - { action: particles, particle: crit, shape: point, count: 15, size: 0.4 }

  # Добивание: доля текущего здоровья, то есть тем больнее, чем целее жертва
  # была до этого удара. Порог проверять нечем, и это к лучшему — удар всегда
  # стоит одного и того же, а награда растёт сама.
  - target: { type: enemies_in_cone, radius: $range, angle: 45, limit: 1 }
    do:
      - { action: damage, amount: $finish, school: true, basis: target_current_health }
      - { action: sound, sound: entity_wither_death, volume: 1.0, pitch: 1.5 }
      - { action: particles, particle: soul_fire_flame, shape: point, count: 30, size: 0.5 }
