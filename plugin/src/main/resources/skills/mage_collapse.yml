# Коллапс: собирает печати и бьёт за каждую.
#
# Урон записан как «за печать, умноженное на число снятых». Снятие и подсчёт —
# одно действие, поэтому посчитать одни печати и снять другие невозможно. В
# старом стеке этот навык всегда наносил одинаковый урон, потому что число
# печатей считалось отдельно от их траты.

id: mage_collapse
display: "Коллапс"
class: mage
tier: 4

mana: $mana
cooldown: $cooldown

steps:

  # Сначала собираем печати — счётчик нужен следующему шагу.
  - target: { type: self }
    do:
      - { action: consume-zones, tag: seal, radius: $gather_radius, counter: seals }
      - { action: particles, particle: reverse_portal, shape: sphere, count: 40, size: 2, at-origin: true }

  # Базовый урон плюс надбавка за каждую снятую печать. Без печатей надбавка
  # равна нулю, и это видно по числу, а не по отсутствию эффекта.
  - target: { type: enemies_in_cone, radius: $radius, angle: $angle }
    do:
      - { action: damage, amount: $damage, school: magic }
      - { action: damage, amount: $damage_per_seal * @seals, school: magic }
      - { action: potion, effect: slowness, duration: $slow_duration, amplifier: 1 }
      - { action: particles, particle: soul_fire_flame, shape: sphere, count: 20, size: 0.8 }

  - target: { type: self }
    do:
      - { action: sound, sound: block_beacon_deactivate, pitch: 0.6 }
