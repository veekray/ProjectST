# 6. Коллапс — финишер. Все печати стягиваются в точку взгляда, волоча за собой
#    врагов, затем один тяжёлый удар по собравшимся.
#
# Ядро здесь намеренно не вызывается: навык не съедает одну печать, а тратит
# всё поле целиком, и усиления не требует.
#
# Точка сбора считается один раз, в этом шаге, и передаётся внутрь. Если бы её
# считал отложенный шаг, маг успел бы отвернуться, и удар пришёлся бы не туда,
# куда стягивало.

id: mage_collapse
display: "Коллапс"
class: mage
icon: NETHER_STAR
tier: 5

cost: $mana
cooldown: $cooldown
cast-time: $cast_time

description:
  - "Финишер. Все печати стягиваются"
  - "в точку взгляда, волоча за собой врагов,"
  - "затем удар — тем сильнее, чем больше печатей."

steps:

  - target: { type: self }
    origin: forward $gather_distance
    do:
      - { action: sound, sound: entity_illusioner_prepare_mirror, pitch: 0.6 }
      - { action: cast, skill: mage_collapse_do, at-targets: true }
