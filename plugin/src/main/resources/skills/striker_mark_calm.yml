# Оставить след «Покой».
#
# Отдельным навыком, а не строкой в каждом: длительность следа объявлена один
# раз, и три места не могут разойтись во времени. Взаимное исключение следов
# объявлено в самих статусах через removes — наложение любого снимает два
# других, и держится всегда ровно один.

id: striker_mark_calm
display: "Покой"
class: striker
tier: 1
internal: true

steps:

  - target: { type: self }
    do:
      - { action: status, id: stance_calm, duration: $duration }
