# Удар по подготовленной жертве даёт Тень.
#
# Тень даётся двумя путями: за подготовленную жертву — кровотечение, яд или
# клеймо, — и за заход со спины.
#
# Спина считается на сервере по повороту тела цели, а не выражением от поворота
# головы, подставленным в строку конфига: прежняя проверка именно поэтому врала
# на разворотах, и её выключили. Тело разворачивается медленно, и зайти за него
# — действие, а не удача.
#
# Четыре одинаковых шага вместо одного «или»: условия шага складываются только
# через «и», и четыре честных шага понятнее одного хитрого. Повторную выдачу
# держит пауза vuln_cd внутри assassin_shadow_grant.

id: assassin_vuln_check
display: "Вскрытие"
class: assassin
tier: 1
internal: true

on: deal-damage

steps:

  - target: { type: trigger }
    if:
      - { caster: has-status, value: vuln_cd, not: true }
      - { target: has-status, value: bleed }
    do:
      - { action: cast, skill: assassin_shadow_grant, at-targets: false }

  - target: { type: trigger }
    if:
      - { caster: has-status, value: vuln_cd, not: true }
      - { target: has-status, value: venom }
    do:
      - { action: cast, skill: assassin_shadow_grant, at-targets: false }

  - target: { type: trigger }
    if:
      - { caster: has-status, value: vuln_cd, not: true }
      - { target: has-status, value: reaper_brand }
    do:
      - { action: cast, skill: assassin_shadow_grant, at-targets: false }

  - target: { type: trigger }
    if:
      - { caster: has-status, value: vuln_cd, not: true }
      - { target: behind, value: "$back_arc" }
    do:
      - { action: cast, skill: assassin_shadow_grant, at-targets: false }
