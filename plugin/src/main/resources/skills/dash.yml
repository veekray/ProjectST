# Рывок — единственный навык, который есть у всех и сразу.
#
# Его не изучают, он не занимает слот и не принадлежит классу: отступить должен
# уметь и тот, кто класс ещё не выбрал. Поэтому innate, а не internal: служебный
# навык запускает предмет или класс, врождённый нажимает сам игрок.
#
# Платит выносливостью — общим запасом, а не ресурсом класса. Иначе уклонение
# покупалось бы уроном: каждый уход назад означал бы непущенный навык.
#
# Три заряда. Каждый возвращается сам, через свою перезарядку, считая от момента
# траты: три рывка подряд вернутся по одному, а не все вместе.
#
# direction: movement — рывок идёт туда, куда игрок бежит, а не куда смотрит.
# Бегущий влево и смотрящий на врага хочет уйти влево, а не прыгнуть на врага.
# Стоящему на месте рывок достаётся по взгляду: другой замены у «никуда не иду»
# нет.

id: dash
display: "Рывок"
icon: FEATHER
innate: true
charges: 3

stamina: $stamina
cooldown: $cooldown

description:
  - "Рывок в сторону хода, а не взгляда."
  - "Заряды возвращаются по одному."
  - "Тратит выносливость, а не ресурс класса."

steps:

  - target: { type: self }
    do:
      - { action: dash, strength: $strength, lift: $lift, direction: movement }
      - { action: sound, sound: entity_player_attack_sweep, volume: 0.5, pitch: 1.6, fx: dash.wind }
      - { action: particles, particle: cloud, shape: point, count: 12, size: 0.3, fx: dash_wind }
