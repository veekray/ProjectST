# 5. Переливание душ — тратит одну душу и собирает дань с каждого проклятого.
#
# Число проклятых рядом считается явно и уходит в счётчик, на который умножается
# добавка. В старом стеке это изображалось отдельной механикой на каждую цель,
# и сколько именно их засчиталось, узнавали из отладочных сообщений в чате.
#
# Щиты складываются, поэтому базовая часть и добавка за проклятых дают один
# общий запас, а не вытесняют друг друга.

id: warlock_transfusion
display: "Переливание душ"
class: warlock
icon: GHAST_TEAR
tier: 4

cost: $mana
cooldown: $cooldown
cast-time: $cast_time

description:
  - "Тратит одну душу. Щит и лечение"
  - "за каждого проклятого врага рядом."
  - "Защиту готовят заранее."

steps:

  # Без души навык не работает: условие на кастере отменяет шаг целиком, и
  # дальше тратить нечего.
  - target: { type: self }
    if:
      - { caster: has-status, value: soul }
    do:
      - { action: remove-status, id: soul, stacks: 1 }
      - { action: sound, sound: entity_wither_ambient, volume: 0.8, pitch: 1.7, fx: warlock.transfusion }

  - target: { type: enemies_in_radius, radius: $radius }
    if:
      - { caster: has-status, value: soul }
      - { target: has-status, value: curse }
    do:
      - { action: particles, particle: soul, shape: ring, count: 50, size: radius, fx: warlock_transfusion_wave }
      - { action: count, counter: cursed }
      - { action: particles, particle: soul, shape: point, count: 12, fx: warlock_soul_drain }

  - target: { type: self }
    if:
      - { caster: has-status, value: soul }
    do:
      - { action: status, id: shield, duration: $shield_duration, amount: $shield }
      - { action: heal, amount: $heal }

  - target: { type: self }
    if:
      - { caster: counter, value: "cursed:1" }
    do:
      - { action: status, id: shield, duration: $shield_duration, amount: $shield_per * @cursed }
      - { action: heal, amount: $heal_per * @cursed }
      - { action: sound, sound: entity_vex_hurt, volume: 0.4, pitch: 0.9, fx: warlock.shield.hum }
