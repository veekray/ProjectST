# Ответ коры: оглушает того, кто ударил.
#
# Служебный навык класса: игрок его не изучает, он работает у всякого друида,
# пока на нём держится кора.
#
# Заряд тратит слушатель урона — тот же, что отменяет удар. Если бы его тратил и
# этот навык, один удар съедал бы два заряда, и усиленная кора держала бы один
# удар вместо двух.

id: druid_bark_react
display: "Кора — ответ"
class: druid
tier: 3
internal: true

on: damaged

steps:

  - target: { type: trigger }
    if:
      - { caster: has-status, value: bark_guard }
    do:
      - { action: status, id: stun, duration: $stun_duration }
      - { action: particles, particle: composter, shape: point, count: 25, fx: druid_bark_splinter }

  - target: { type: self }
    if:
      - { caster: has-status, value: bark_guard }
    do:
      - { action: sound, sound: block_wood_break, pitch: 0.8, fx: none }
