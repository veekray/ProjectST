# Тело Коллапса. Отдельный навык, потому что точку сбора ему передаёт
# вызывающий: у всех его шагов, включая отложенный удар, она одна и та же.

id: mage_collapse_do
display: "Коллапс"
class: mage
tier: 5
internal: true

steps:

  # Круг удара виден сразу, за секунду до самого удара: граница — тот же радиус,
  # которым удар выберет цели. Раньше здесь было кольцо в четыре блока при
  # ударе в пять.
  - target: { type: enemies_near_origin, radius: $hit_radius }
    do:
      - { action: particles, particle: witch, shape: ring, count: 44, size: radius, fx: mage_collapse_field }
      - { action: particles, particle: portal, shape: sphere, count: 80, size: 3, at-origin: true }

  # Тянет тех, кого накрыли печати, а не всех вокруг мага: расстановка поля
  # решает, кого соберёт. Цели считаются ДО того, как печати сгорят.
  - target: { type: enemies_near_zone, tag: seal, radius: $seal_reach }
    do:
      - { action: pull, strength: $pull, ticks: 3 }
      - { action: particles, particle: portal, shape: sphere, count: 20, size: 0.4 }

  # Теперь поле тратится целиком, и число печатей идёт в счётчик.
  - target: { type: self }
    do:
      - { action: consume-zones, tag: seal, radius: $field_radius, counter: seals }

  # Удар по собравшимся: секунда на сбор. Базовый урон плюс надбавка за каждую
  # потраченную печать. Без печатей надбавка равна нулю — это видно по числу,
  # а не по отсутствию эффекта.
  - target: { type: enemies_near_origin, radius: $hit_radius }
    delay: 20
    do:
      - { action: damage, amount: $damage, school: magic }
      - { action: damage, amount: $damage_per_seal * @seals, school: magic }
      - { action: particles, particle: witch, shape: sphere, count: 40, size: 0.5 }
      - { action: particles, particle: end_rod, shape: sphere, count: 20, size: 0.4 }
      - { action: particles, particle: witch, shape: ring, count: 44, size: radius, fx: mage_collapse_blast }

  - target: { type: self }
    delay: 20
    do:
      - { action: sound, sound: entity_generic_explode, pitch: 0.7, at-origin: true }
