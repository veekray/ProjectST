# 4. Пыль в Глаза — слепота вокруг и уклонение себе.
#
# Ослабление цели перенесено надбавкой к физическому урону, а не к «атаке»:
# стата с таким именем в этом ядре нет, и подставлять похожий молча — то самое
# расхождение, из-за которого числа старого стека не сходились с боем.

id: trickster_blinding_dust
display: "Пыль в Глаза"
class: trickster
icon: GUNPOWDER
tier: 2

cost: $spirit
cooldown: $cooldown
cast-time: $cast_time

description:
  - "Облако пыли: враги вокруг слепнут"
  - "и бьют слабее, а по трикстеру"
  - "попадают хуже."

steps:

  - target: { type: self }
    do:
      - { action: sound, sound: entity_snowball_throw, volume: 1.0, pitch: 0.7 }
      - { action: status, id: dust_cover, duration: $duration }
      - action: modify-stat
        stat: dodge_rating
        op: flat
        value: $dodge
        status: dust_cover

  - target: { type: enemies_in_radius, radius: $radius }
    do:
      - { action: particles, particle: smoke, shape: ring, count: 60, size: radius, fx: trickster_wave }
      - { action: potion, effect: blindness, duration: $duration, amplifier: 0 }
      - { action: status, id: weakened, duration: $duration }
      - action: modify-stat
        stat: physical_damage
        op: percent
        value: $weaken
        status: weakened
      - { action: particles, particle: smoke, shape: point, count: 15, size: 0.4, fx: trickster_sink }
