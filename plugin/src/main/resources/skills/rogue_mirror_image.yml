# 5. Отражение — двойник, который взрывается, когда к нему подходят.
#
# Двойник собран из двух частей: видимой подставки и зоны, которая его и
# взводит. Зона знает своего хозяина, поэтому сам плут и его призванные её не
# трогают, а вход считается один раз на каждого вошедшего — не каждый тик, пока
# он стоит рядом.
#
# Расхождение названо честно: прежний двойник выглядел как игрок, здесь это
# подставка. Своя модель придёт с модулем мобов.

id: rogue_mirror_image
display: "Отражение"
class: rogue
icon: GLASS_PANE
tier: 4

cost: $spirit
cooldown: $cooldown

description:
  - "Двойник на месте, вы — в сторону."
  - "Когда к нему подходят, он взрывается:"
  - "слепит и делает задетых уязвимее."

steps:

  - target: { type: self }
    origin: self
    do:
      - { action: sound, sound: entity_illusioner_cast_spell, pitch: 1.0 }
      - action: summon
        mob: armor_stand
        tag: mirror
        duration: $duration
        attacks-enemies: false
      - action: zone
        tag: mirror
        radius: $trigger_radius
        duration: $duration
        particle: smoke
        at-origin: true
        on-enter: rogue_mirror_burst
      - { action: potion, effect: invisibility, duration: $vanish_duration, amplifier: 0 }

  # Прыжок назад: плут уходит от собственного двойника, а не стоит в нём.
  - target: { type: self }
    do:
      - { action: dash, strength: $leap_back, lift: 0.35 }
