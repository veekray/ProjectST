# 2. Землетрясение — подбрасывает и вязнет.

id: berserker_quake
display: "Землетрясение"
class: berserker
icon: COBBLESTONE
tier: 1

cost: $spirit
cooldown: $cooldown
cast-time: $cast_time

description:
  - "Удар по земле подбрасывает всех"
  - "вокруг и оставляет их вязнуть."
  - "Платит здоровьем вдвое дороже."

steps:

  - target: { type: self }
    do:
      - { action: sacrifice, percent: $cost }
      - { action: cast, skill: berserker_heat, at-targets: true }
      - { action: cast, skill: berserker_heat, at-targets: true }
      - { action: sound, sound: entity_ravager_attack, volume: 1.0, pitch: 0.7, fx: berserker.quake.raise }

  - target: { type: enemies_in_radius, radius: $radius }
    delay: $strike_delay
    telegraph: berserker_quake_mark
    do:
      - { action: damage, amount: $damage, school: physical }
      - { action: push, strength: 0.1, lift: 1.1 }
      - { action: status, id: slowed, duration: $slow_duration }
      - action: modify-stat
        stat: movement_speed
        op: flat
        value: $slow
        status: slowed
      - { action: particles, particle: cloud, shape: ring, count: 30, size: radius, fx: berserker_quake }
