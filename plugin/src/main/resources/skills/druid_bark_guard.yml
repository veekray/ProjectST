# 3. Кора — поглощает удар и оглушает ударившего.
#
# Ответ живёт в отдельном служебном навыке druid_bark_react: он срабатывает по
# получению урона, пока держится кора. Так ответ видно как ответ, а не как
# побочный эффект щита, и порядок проверок у него общий со всеми навыками.
#
# Кора гасит удар целиком, а не уменьшает его: каждый стак — один поглощённый
# удар, обычная держит один, усиленная два. Отменой занимается слушатель урона,
# потому что обычный удар мечом идёт мимо нашего конвейера.

id: druid_bark_guard
display: "Кора"
class: druid
icon: OAK_LOG
tier: 3

cost: $mana
cooldown: $cooldown

description:
  - "Кора гасит удар целиком и оглушает"
  - "того, кто его нанёс. Копит Рост."
  - "На трёх Увядания: держит два удара."

steps:

  - target: { type: self }
    do:
      - { action: sound, sound: block_wood_place, pitch: 0.7 }
      - { action: particles, particle: composter, shape: sphere, count: 40, size: 1.4, fx: druid_rise }
      - { action: status, id: bark_guard, duration: $duration }

  # Усиленная держит два ответа вместо одного. Тратит Увядание.
  - target: { type: self }
    if:
      - { caster: status-stacks, value: "wither:3" }
    do:
      - { action: status, id: bark_guard, duration: $duration }
      - { action: remove-status, id: wither }

  - target: { type: self }
    do:
      - { action: status, id: growth, duration: $counter_duration }
