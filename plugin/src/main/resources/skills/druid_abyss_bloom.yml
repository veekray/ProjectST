# 6. Цвет бездны — поле, которое каждую секунду меняет сторону.
#
# Зона живёт сама: у неё свой промежуток и свой навык тика, поэтому поле бьёт
# тех, кто в нём стоит, а не тех, кто рядом с друидом, и ни одного условия в
# самом навыке для этого не нужно.
#
# Тратит оба счётчика целиком: это финишер, и платить за него должны обе роли.

id: druid_abyss_bloom
display: "Цвет бездны"
class: druid
icon: WITHER_ROSE
tier: 5

cost: $mana
cooldown: $cooldown
# Самая долгая подготовка друида: поле на всю схватку стоит того, чтобы его
# можно было сорвать.
cast-time: $cast_time

description:
  - "Поле, которое каждую секунду меняет"
  - "сторону: то лечит своих, то жжёт чужих."
  - "Тратит оба счётчика целиком."

steps:

  - target: { type: self }
    origin: self
    do:
      - { action: sound, sound: block_sculk_spread, pitch: 0.6, fx: none }
      - { action: particles, particle: composter, shape: sphere, count: 120, size: 3, at-origin: true, fx: none }
      - action: zone
        tag: bloom
        radius: $radius
        duration: $duration
        particle: composter
        fx: druid_abyss_flower
        at-origin: true
        on-tick: druid_bloom_tick
        tick-interval: 20

  - target: { type: self }
    do:
      - { action: remove-status, id: growth }
      - { action: remove-status, id: wither }
