# 4. Вскрытие Артерии — кровотечение от предела здоровья цели.
#
# Со Тенью срок кровотечения удваивается, и Тень тратится. Урон тика считается
# долей предела здоровья: иначе кровотечение одинаково щекотало бы и кролика,
# и дракона.

id: assassin_arterial_cut
display: "Вскрытие Артерии"
class: assassin
icon: REDSTONE
tier: 3

cost: $spirit
cooldown: $cooldown

description:
  - "Удар, после которого цель истекает"
  - "кровью. Со Тенью кровотечение"
  - "держится вдвое дольше."

steps:

  - target: { type: enemies_in_radius, radius: $range, limit: 1 }
    do:
      - { action: damage, amount: $damage, school: physical }
      - { action: sound, sound: entity_player_attack_sweep, volume: 1.0, pitch: 0.8 }
      - { action: particles, particle: damage_indicator, shape: point, count: 20, size: 0.4 }

  - target: { type: enemies_in_radius, radius: $range, limit: 1 }
    if:
      - { caster: has-status, value: shadow, not: true }
    do:
      - { action: status, id: bleed, duration: $bleed_duration }

  - target: { type: enemies_in_radius, radius: $range, limit: 1 }
    if:
      - { caster: has-status, value: shadow }
    do:
      - { action: status, id: bleed, duration: $bleed_duration_exposed }

  - target: { type: self }
    if:
      - { caster: has-status, value: shadow }
      - { caster: has-status, value: executioner, not: true }
    do:
      - { action: remove-status, id: shadow }
