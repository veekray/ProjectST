# Образец навыка: один файл — один навык.
#
# Здесь лежит всё, что раньше было размазано по четырём плагинам: логика,
# принадлежность классу и ступени, стоимость. Числа идут ссылками вида $ключ
# в balance.yml, и их существование проверяется при загрузке.
#
# Шаг — это один набор целей и всё, что с ними делается. Цели шага вычисляются
# ОДИН раз, и все его действия видят ровно один и тот же список. Нужны другие
# цели — пишите другой шаг, и это будет видно прямо в файле.

id: mage_mana_bolt
display: "Мановый разряд"
class: mage
tier: 2

mana: $mana
cooldown: $cooldown

steps:

  # Снаряд летит, его видно и его можно обогнать — этим он и отличается от
  # мгновенного луча, поэтому примитив называется иначе.
  #
  # on-hit и on-end здесь один и тот же навык, и это не экономия: «разорваться
  # в этой точке» — одно и то же действие, попал снаряд в кого-то или просто
  # закончился. Поэтому печать остаётся там, куда прилетело, в обоих случаях.
  - target: { type: self }
    do:
      - { action: sound, sound: entity_illusioner_cast_spell, pitch: 1.4 }
      - action: projectile
        speed: $speed
        range: $range
        hit-radius: 1.3
        particle: electric_spark
        on-hit: mage_mana_bolt_impact
        on-end: mage_mana_bolt_impact
