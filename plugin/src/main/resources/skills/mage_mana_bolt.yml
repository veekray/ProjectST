# 2. Мановый разряд — снаряд по прямой. Дешёвая кнопка, которой размечают поле:
#    печать ложится в точке попадания, то есть далеко.
#
# Усиленный бьёт вдвое больнее и пробивает насквозь, но печати не оставляет.

id: mage_mana_bolt
display: "Мановый разряд"
class: mage
icon: AMETHYST_SHARD
tier: 2

cost: $mana
cooldown: $cooldown

description:
  - "Снаряд по прямой; печать ложится там,"
  - "куда он прилетел — так размечают поле."
  - "На своей печати: бьёт вдвое и пробивает."

steps:

  - target: { type: self }
    do:
      - { action: cast, skill: mage_seal_core, at-targets: true }
      - { action: sound, sound: entity_illusioner_cast_spell, volume: 0.8, pitch: 1.6 }
      - { action: particles, particle: enchant, shape: sphere, count: 14, size: 0.4 }

  # Обычный: останавливается о первую цель, печать остаётся там, где он кончился.
  - target: { type: self }
    if:
      - { caster: has-status, value: empowered, not: true }
    do:
      - action: projectile
        speed: $speed
        range: $range
        hit-radius: 1.0
        particle: enchant
        fx: mage_bolt
        on-hit: mage_bolt_hit
        on-end: mage_seal_drop

  # Усиленный: быстрее, дальше, пробивает до пяти целей и печати не ставит.
  - target: { type: self }
    if:
      - { caster: has-status, value: empowered }
    do:
      - action: projectile
        speed: $empowered_speed
        range: $empowered_range
        hit-radius: 1.3
        pierce: 5
        particle: witch
        fx: mage_bolt_strong
        on-hit: mage_bolt_hit_strong
