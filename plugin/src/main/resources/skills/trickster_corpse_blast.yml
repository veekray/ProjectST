# Взрыв тела-обманки: срабатывает, когда к нему подходят.

# Класса у навыка нет намеренно: его кастует моб, а не игрок, и правило в этом
# ядре одно — навык моба всегда служебный и ничей. Иначе он попал бы в дерево
# класса и однажды оказался бы изучаемым.

id: trickster_corpse_blast
display: "Обманка"
internal: true

steps:

  - target: { type: enemies_in_radius, radius: $radius }
    do:
      - { action: damage, amount: $damage, school: magic }
      - { action: potion, effect: blindness, duration: $blind, amplifier: 0 }
      - { action: push, strength: $push, lift: 0.5 }
      - { action: particles, particle: explosion, shape: point, count: 3, size: 0.5 }
      - { action: sound, sound: entity_generic_explode, volume: 1.0, pitch: 1.4 }
