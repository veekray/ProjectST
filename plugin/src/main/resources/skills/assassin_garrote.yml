# 5. Удавка — работает только по подготовленной жертве.
#
# Подготовленной считается та, на которой висит кровотечение, яд или клеймо —
# или та, к которой ассасин зашёл со спины. Условия здесь ровно те же, что
# качают Тень: подкласс держится на одной идее, а не на двух.

id: assassin_garrote
display: "Удавка"
class: assassin
icon: STRING
tier: 3

cost: $spirit
cooldown: $cooldown
cast-time: $cast_time

description:
  - "Душит подготовленную жертву или ту,"
  - "к кому зашли со спины: оглушение,"
  - "тишина и полный запрет лечения."

steps:

  - target: { type: enemies_in_radius, radius: $range, limit: 1 }
    if:
      - { target: has-status, value: bleed }
    do:
      - { action: cast, skill: assassin_garrote_apply, at-targets: false }

  - target: { type: enemies_in_radius, radius: $range, limit: 1 }
    if:
      - { target: has-status, value: venom }
    do:
      - { action: cast, skill: assassin_garrote_apply, at-targets: false }

  - target: { type: enemies_in_radius, radius: $range, limit: 1 }
    if:
      - { target: has-status, value: reaper_brand }
    do:
      - { action: cast, skill: assassin_garrote_apply, at-targets: false }

  - target: { type: enemies_in_radius, radius: $range, limit: 1 }
    if:
      - { target: behind, value: "$back_arc" }
    do:
      - { action: cast, skill: assassin_garrote_apply, at-targets: false }
