# Статусы и отношения между ними.
#
# Это то место, ради которого затевался проект: конфликты объявлены здесь, а не
# размазаны по условиям отдельных навыков. Граф проверяется при загрузке, и
# /rpg validate покажет ошибку с номером строки до того, как её увидит игрок.
#
# Ключи:
#   category    control | buff | debuff | shield | immunity | mark
#   duration    длительность по умолчанию, тики
#   stacking    none | refresh | extend | stacks
#   max-stacks  больше 1 допустим только при stacking: stacks
#   priority    кто кого вытесняет в exclusive
#   exclusive   категория, в которой одновременно активен только один статус
#   suppresses  пока активен, перечисленные не действуют, но тикают
#   removes     наложение снимает перечисленные
#   blocks      пока активен, перечисленные не наложить
#   tags        метки для условий навыков; blocks-cast запрещает касты
#   display     имя для игрока; без него статус служебный и на экране не виден
#   description что статус делает, в два-три слова: пишется под значком, когда
#               числами показать нечего — «без навыков», «гасит удар»
#
# Взаимное подавление запрещено: исход зависел бы от порядка наложения.
# Взаимная блокировка разрешена: кто успел первым, тот и стоит.

statuses:

  # ---------------------------------------------------------------- контроль
  # Все жёсткие контроли исключительны внутри своей категории: два
  # одновременных контроля — это и есть то самое наложение механик.
  stun:
    display: "Оглушение"
    description: "без действий"
    color: RED
    category: control
    duration: 40
    stacking: refresh
    priority: 20
    exclusive: control
    # immobilize — это не описание, а поведение: пока статус держится, цель не
    # ходит. Что именно он делает, решает контент, а не имя статуса в коде.
    tags: [hard, blocks-cast, immobilize]

  root:
    display: "Корни"
    description: "обездвижен"
    color: DARK_GREEN
    category: control
    duration: 60
    stacking: refresh
    priority: 10
    exclusive: control
    tags: [soft, immobilize]

  # Метка blocks-cast — единственное место, где написано «нельзя кастовать».
  # Проверка в CastService читает её, а не перечисляет статусы по именам:
  # иначе новый контроль молча оказался бы кастуемым.
  silence:
    display: "Тишина"
    description: "без навыков"
    color: DARK_PURPLE
    category: debuff
    duration: 60
    stacking: refresh
    tags: [soft, blocks-cast]

  # Изъятие из боя: Кокон мучений колдуна. Приоритетнее любого контроля,
  # подавляет их и попутно не даёт наложить новые.
  banish:
    display: "Изъятие"
    description: "вне боя"
    color: YELLOW
    category: immunity
    duration: 80
    # Продлеваемое, а не обновляемое: Кокон накладывает базовые четыре секунды и
    # добавку за каждую душу, и они должны складываться. С обновлением добавка
    # заменяла бы базу, и кокон с одной душой выходил бы короче, чем без душ.
    stacking: extend
    priority: 100
    exclusive: control
    suppresses: [stun, root]
    blocks: [stun, root]
    tags: [hard, immunity, blocks-cast, immobilize]

  # ---------------------------------------------------------------- щиты
  # Запас берётся из amount при наложении, поэтому один статус обслуживает
  # щиты любого размера.
  shield:
    display: "Щит"
    description: "поглощает"
    color: BLUE
    category: shield
    duration: 200
    stacking: refresh

  # ---------------------------------------------------------------- метки
  mark:
    category: mark
    duration: 160
    stacking: refresh

  # Счётчик: души колдуна, стаки равновесия друида.
  charge:
    category: buff
    duration: 300
    stacking: stacks
    max-stacks: 5
  # ---------------------------------------------------------------- маг
  # Усиление на один каст: ядро мага снимает его первым шагом каждого навыка,
  # поэтому бесплатно дожить до следующего нажатия оно не может.
  empowered:
    category: buff
    duration: 20
    stacking: refresh
    display: "Печать съедена"
    description: "сильный каст"
    color: AQUA
    tags: [soft]
  # ---------------------------------------------------------------- друид
  # Счётчики ролей. Стаки, а не отдельные статусы на каждое число: «три Роста»
  # проверяется одним условием, и максимум объявлен один раз здесь.
  growth:
    category: buff
    duration: 300
    stacking: stacks
    max-stacks: 3
    # Имя и цвет — для ХУДа мода. Счётчик ядра игрок читает в бою, и читать он
    # должен «Рост», а не growth: идентификатор нужен файлам, а не глазам.
    display: "Рост"
    color: GREEN
    tags: [counter]

  wither:
    category: debuff
    duration: 300
    stacking: stacks
    max-stacks: 3
    display: "Увядание"
    color: GOLD
    tags: [counter]

  # Заряды ответа коры: обычная держит один, усиленная два.
  bark_guard:
    display: "Кора"
    description: "гасит удар"
    color: GOLD
    category: buff
    duration: 200
    stacking: stacks
    max-stacks: 2
    # absorb-hit: каждый стак гасит один удар целиком. Прежде кора была щитом на
    # величину, и «поглощает удар» означало «уменьшает урон» — не то, что
    # обещано её описанием.
    tags: [soft, absorb-hit]

  # Метка фазы поля: есть — значит прошлый тик был ростом.
  bloom_phase:
    category: buff
    duration: 30
    stacking: refresh
    tags: [soft]
  # ---------------------------------------------------------------- колдун
  # Души. Их даёт отработавшее проклятие, тратят Переливание и Кокон.
  soul:
    category: buff
    duration: 600
    stacking: stacks
    max-stacks: 5
    display: "Души"
    color: LIGHT_PURPLE
    tags: [counter]

  # Иссушение: по нему тикает урон и считается дань Переливания.
  curse:
    display: "Иссушение"
    description: "тикает урон"
    color: DARK_PURPLE
    category: debuff
    duration: 100
    stacking: refresh
    tags: [soft, curse]

  reaper_mark:
    category: mark
    duration: 300
    stacking: refresh
    tags: [mark]

  chains:
    category: debuff
    duration: 160
    stacking: refresh
    tags: [soft]
  # ---------------------------------------------------------------- плут
  # Метка Шага призрака: держится до первого удара, поэтому крит ровно один.
  ambush:
    display: "Из тени"
    description: "верный крит"
    color: GRAY
    category: buff
    duration: 60
    stacking: refresh
    tags: [soft]

  death_mark:
    category: mark
    duration: 100
    stacking: refresh
    tags: [mark]

  # Удары, нанесённые по помеченному. Копятся у плута, а не у цели: метка одна,
  # а бить по ней могут из нескольких рук.
  mark_stacks:
    category: buff
    duration: 200
    stacking: stacks
    max-stacks: 20
    display: "Удары по метке"
    color: RED
    tags: [counter]

  # ---------------------------------------------------------------- ассасин
  # Ядро подкласса — Тень: есть или нет. Отдельного числа нет намеренно, иначе
  # «готова ли Тень» пришлось бы спрашивать у счётчика, а показывать игроку —
  # у статуса, и однажды они разошлись бы.
  shadow:
    display: "Тень"
    color: DARK_PURPLE
    category: buff
    duration: 6000
    stacking: stacks
    max-stacks: 1
    tags: [counter]

  # Метка боя. Пока висит — Тень не копится; её длительность и есть тот самый
  # «таймер тишины», отдельного счётчика нет.
  combat_mark:
    display: "В бою"
    description: "Тень стоит"
    color: GRAY
    category: debuff
    duration: 60
    tags: [soft]

  # Пауза между выдачами Тени за удар по подготовленной жертве: без неё Тень
  # качалась бы каждым тычком.
  vuln_cd:
    category: buff
    duration: 60
    tags: [soft]

  bleed:
    display: "Кровотечение"
    description: "тикает урон"
    color: DARK_RED
    category: debuff
    duration: 100
    tags: [soft]

  venom:
    display: "Трупный Яд"
    description: "тикает урон"
    color: DARK_GREEN
    category: debuff
    duration: 120
    stacking: stacks
    max-stacks: 3
    tags: [soft]

  # Заряды яда на клинках: каждый удар снимает один стак.
  venom_coat:
    display: "Яд на клинках"
    description: "яд в ударах"
    color: GREEN
    category: buff
    duration: 200
    stacking: stacks
    max-stacks: 4
    tags: [soft]

  reaper_brand:
    display: "Клеймо Жнеца"
    description: "клеймо"
    color: DARK_PURPLE
    category: mark
    duration: 160
    tags: [mark]

  veil:
    display: "Покров"
    description: "в тени"
    color: DARK_GRAY
    category: buff
    duration: 60
    tags: [soft]

  riposte_window:
    display: "Готов к ответу"
    description: "контрудар"
    color: YELLOW
    category: buff
    duration: 16
    tags: [soft]

  executioner:
    display: "Час Палача"
    description: "сила крита"
    color: RED
    category: buff
    duration: 160
    tags: [soft]

  # Замки: короткие статусы, не дающие сработать дважды там, где условие
  # проверяется несколькими путями.
  garrote_lock:
    category: buff
    duration: 10
    tags: [soft]

  execute_lock:
    category: buff
    duration: 20
    tags: [soft]

  cascade_hit:
    category: mark
    duration: 60
    tags: [mark]

  # ---------------------------------------------------------------- трикстер
  # Маркер «копии живы». Он же счётчик ядра на экране: сколько именно копий
  # ходит рядом, игрок видит глазами, а вот идёт ли сейчас усиление за них —
  # нет, и об этом говорит статус.
  doubles:
    display: "Двойники"
    color: LIGHT_PURPLE
    category: buff
    duration: 600
    tags: [counter]

  carnival:
    display: "Карнавал"
    description: "двойники"
    color: LIGHT_PURPLE
    category: buff
    duration: 200
    tags: [soft]

  # Ложная смерть: неуязвимость статусом, а не запретом урона мимо конвейера.
  # Все отказы в этом ядре объяснимы, и «урон не прошёл» обязан иметь причину,
  # которую видно в отладке.
  feigned:
    display: "Ложная смерть"
    description: "неуязвим"
    color: DARK_GRAY
    category: immunity
    duration: 40
    tags: [soft, immunity]

  # ---------------------------------------------------------------- охотник
  # Добыча всегда одна: метка снимается со всех вокруг перед тем, как лечь на
  # новую цель. Отдельного «кто сейчас добыча» нет и не нужно — вопрос задаётся
  # самой цели.
  quarry:
    display: "Добыча"
    description: "цель охоты"
    color: GOLD
    category: mark
    duration: 400
    tags: [mark]

  rot:
    display: "Гниющая рана"
    description: "хуже лечится"
    color: DARK_GREEN
    category: debuff
    duration: 120
    tags: [soft]

  # Заряды азарта: пять — и включается разгон. Промежуточных ступеней нет
  # намеренно, либо разогнался, либо нет.
  rush:
    display: "Азарт"
    color: GOLD
    category: buff
    duration: 300
    stacking: stacks
    max-stacks: 5
    tags: [counter]

  # Маркер разгона. Он же замок: без него надбавка вешалась бы на каждом
  # следующем попадании и за десяток выстрелов раздула бы статы до абсурда.
  rush_full:
    display: "Разгон"
    description: "разгон"
    color: RED
    category: buff
    duration: 300
    tags: [soft, buff]

  sense:
    display: "Чутьё"
    description: "видит врагов"
    color: AQUA
    category: buff
    duration: 160
    tags: [soft, buff]

  deadly_hunt:
    display: "Смертельная Охота"
    description: "охота"
    color: GOLD
    category: buff
    duration: 200
    tags: [soft, buff]

  # ---------------------------------------------------------------- плут
  eagle_eye:
    display: "Орлиное Зрение"
    description: "точность"
    color: AQUA
    category: buff
    duration: 200
    tags: [soft, buff]

  thrill:
    display: "Кураж"
    description: "кураж"
    color: YELLOW
    category: buff
    duration: 200
    tags: [soft, buff]

  # ---------------------------------------------------------------- берсерк
  # Жар — ядро класса. Копится платой здоровьем, быстро остывает. Надбавку к
  # урону считает навык berserker_heat: она равна «сила жара × стаки» и ставится
  # одним источником, поэтому не может сложиться сама с собой.
  heat:
    display: "Жар"
    color: RED
    category: buff
    duration: 100
    stacking: stacks
    max-stacks: 10
    tags: [counter]

  # Перегрев: короткое окно на полном Жаре, ради которого всё и платилось.
  overheat:
    display: "Перегрев"
    description: "перегрев"
    color: DARK_RED
    category: buff
    duration: 120
    tags: [soft, buff]

  berserk_bleed:
    display: "Кровоточащая рана"
    description: "тикает урон"
    color: DARK_RED
    category: debuff
    duration: 100
    tags: [soft]

  ignore_pain:
    display: "Боль отложена"
    description: "боль позже"
    color: GRAY
    category: buff
    duration: 100
    tags: [soft, buff]

  # Долг боли: один стак за каждый пропущенный удар. Его число умножает плату,
  # когда стойка кончится.
  pain_debt:
    display: "Долг боли"
    color: DARK_GRAY
    category: debuff
    duration: 200
    stacking: stacks
    max-stacks: 20
    tags: [counter]

  # Непоколебимость блокирует оглушение статусом, а не статом: контроль в этом
  # ядре — это статусы с объявленными конфликтами, и защита от него обязана
  # быть такой же, чтобы конфликт был виден.
  unshakable:
    display: "Непоколебимость"
    description: "не оглушить"
    color: GOLD
    category: immunity
    duration: 60
    blocks: [stun, root]
    suppresses: [stun, root]
    tags: [soft, buff]

  hunger:
    display: "Неутолимый Голод"
    description: "вампиризм"
    color: RED
    category: buff
    duration: 100
    tags: [soft, buff]

  undying:
    display: "Бессмертная Ярость"
    description: "не умирает"
    color: DARK_RED
    category: immunity
    priority: 90
    duration: 100
    tags: [hard, immunity]

  # ---------------------------------------------------------------- страйкер
  # Следы — ядро класса. Держится всегда ровно один: наложение любого снимает
  # два других, и это объявлено здесь, а не повторено в каждом навыке. Иначе
  # «ровно один» было бы договорённостью, которую однажды нарушили бы.
  stance_press:
    display: "Напор"
    description: "след: напор"
    color: RED
    category: buff
    duration: 100
    removes: [stance_breach, stance_calm]
    tags: [soft, buff]

  stance_breach:
    display: "Брешь"
    description: "след: брешь"
    color: GOLD
    category: buff
    duration: 100
    removes: [stance_press, stance_calm]
    tags: [soft, buff]

  stance_calm:
    display: "Покой"
    description: "след: покой"
    color: AQUA
    category: buff
    duration: 100
    removes: [stance_press, stance_breach]
    tags: [soft, buff]

  karma_mark:
    display: "Карма"
    description: "взорвётся"
    color: DARK_PURPLE
    category: mark
    duration: 60
    tags: [mark]

  phantom:
    display: "Уклонение"
    description: "уклоняется"
    color: WHITE
    category: immunity
    priority: 80
    duration: 8
    tags: [soft, immunity]

  asura:
    display: "Режим Асуры"
    description: "удар по всем"
    color: DARK_RED
    category: buff
    duration: 200
    tags: [soft, buff]

  # ---------------------------------------------------------------- рыцарь
  # Вызов — ядро класса. Метка challenge в тегах не декоративна: по ней
  # конвейер урона находит статус и ослабляет удар вызванного по всем, кроме
  # вызвавшего. Насколько именно — лежит в самом наложении (amount), поэтому
  # ульта доводит его до сотни, ничего не переписывая в коде.
  challenge:
    display: "Вызван"
    description: "бьёт слабее"
    color: RED
    category: debuff
    duration: 240
    tags: [soft, challenge]

  guarded:
    display: "Под защитой"
    description: "под защитой"
    color: AQUA
    category: buff
    duration: 100
    tags: [soft, buff]

  shield_wall:
    display: "Глухая Оборона"
    description: "оборона"
    color: GRAY
    category: buff
    duration: 80
    tags: [soft, buff]

  retribution:
    display: "Возмездие"
    description: "ответ x3"
    color: GOLD
    category: buff
    duration: 30
    tags: [soft, buff]

  fortress:
    display: "Абсолютная Фортеция"
    description: "крепость"
    color: GOLD
    category: buff
    duration: 160
    tags: [soft, buff]

  # ---------------------------------------------------------------- воин
  # Ядра у воина нет, и эти статусы его не образуют: каждый принадлежит своему
  # навыку и живёт ровно столько, сколько тот работает.
  shield_up:
    display: "Щит поднят"
    description: "щит поднят"
    color: GRAY
    category: buff
    duration: 40
    tags: [soft, buff]

  rage:
    display: "Ярость"
    description: "ярость"
    color: RED
    category: buff
    duration: 100
    tags: [soft, buff]

  # Отметки попавших ударов связки: два — и третий бьёт вдвое.
  combo:
    display: "Связка"
    color: GOLD
    category: buff
    duration: 40
    stacking: stacks
    max-stacks: 2
    tags: [counter]

  warrior_stance:
    display: "Стойка"
    description: "стойка"
    color: GRAY
    category: buff
    duration: 40
    tags: [soft, buff]

  # Счёт принятых в Стойке ударов. Считаются удары, а не их сумма: удар молота и
  # щелчок должны отличаться, но не настолько, чтобы стойка окупалась одним
  # попаданием.
  stance_taken:
    display: "Принято ударов"
    color: DARK_GRAY
    category: buff
    duration: 100
    stacking: stacks
    max-stacks: 20
    tags: [counter]

  # ---------------------------------------------------------------- общие
  # Общие дебафы навыков, у которых своего статуса нет: замедление, просевшая
  # защита, ослабленный урон. Числа к ним привязывает навык (modify-stat со
  # status), поэтому статус один, а насколько он режет, решает тот, кто его
  # наложил. Общие, а не по навыку: игроку важно «меня замедлили», а не каким
  # именно умением, — и два замедления от разных навыков не складываются,
  # действует последнее.
  slowed:
    display: "Замедление"
    description: "медленнее"
    color: AQUA
    category: debuff
    duration: 40
    tags: [soft]

  exposed:
    display: "Уязвимость"
    description: "защита ниже"
    color: GOLD
    category: debuff
    duration: 40
    tags: [soft]

  weakened:
    display: "Ослабление"
    description: "урон ниже"
    color: DARK_PURPLE
    category: debuff
    duration: 40
    tags: [soft]

  # Замирание на прицеливании Смертельного выстрела. Дебаф, а не контроль: его
  # кладёт себе сам стрелок, и снимать его чужими очищениями незачем.
  aiming:
    display: "Прицеливание"
    description: "не двигается"
    color: GRAY
    category: debuff
    duration: 40

  # Бафы навыков, у которых своего статуса не было: надбавки к ним привязаны
  # через modify-stat со status. Без метки buff — их не крадёт Карманник, как
