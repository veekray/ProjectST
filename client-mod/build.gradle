// Сборка клиентского мода.
//
// Отдельно от плагина: NeoForge и его зависимости нужно выкачивать из сети, а
// плагин собирается офлайн. Поэтому корневой settings.gradle.kts этот каталог не
// включает, и сборка плагина мод не трогает.

plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'ru.projectst.rpgcore'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // Версия под 1.21.1. Менять вместе с версией сервера и не раньше неё:
    // мод новее сервера получает отказ по версии протокола.
    version = '21.1.255'

    runs {
        client {
            client()
        }
    }

    mods {
        rpgcore {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Тесты мода — чистая математика сцен без Minecraft: что корни, лозы и облака
// не выходят за радиус события. Рисунок проверяет глаз, числа — тест.
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
