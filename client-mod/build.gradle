// Сборка клиентского мода.
//
// Отдельно от плагина: NeoForge и его зависимости нужно выкачивать из сети, а
// плагин собирается офлайн. Поэтому корневой settings.gradle.kts этот каталог не
// включает, и сборка плагина мод не трогает.

plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'ru.projectst.rpgcore'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // Версия под 1.21.1. Менять вместе с версией сервера и не раньше неё:
    // мод новее сервера получает отказ по версии протокола.
    version = '21.1.95'

    runs {
        client {
            client()
        }
    }

    mods {
        rpgcore {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
